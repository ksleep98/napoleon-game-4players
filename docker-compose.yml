version: "3.8"

# Infrastructure-only Docker Compose
# Next.js app は vercel dev でホスト上で実行
# このファイルはローカルSupabaseインフラ + 将来のサービス（Flask等）用

services:
  # Supabase PostgreSQL Database
  supabase-db:
    image: supabase/postgres:15.1.0.117
    container_name: napoleon-supabase-db
    ports:
      - "54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password-change-me}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./docs/deployment/production_database_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - napoleon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.99.0
    container_name: napoleon-supabase-auth
    ports:
      - "54324:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-dev-password-change-me}@supabase-db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-at-least-32-characters-long}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_MAILER_AUTOCONFIRM: true
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - napoleon-network

  # Supabase REST API (PostgREST)
  supabase-rest:
    image: postgrest/postgrest:v11.2.0
    container_name: napoleon-supabase-rest
    ports:
      - "54323:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-local-dev-password-change-me}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: false
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - napoleon-network

  # Supabase Studio (Database management UI)
  supabase-studio:
    image: supabase/studio:20231123-64a766a
    container_name: napoleon-supabase-studio
    ports:
      - "54325:3000"
    environment:
      SUPABASE_URL: http://localhost:54321
      STUDIO_PG_META_URL: http://supabase-rest:3000
    depends_on:
      - supabase-rest
    networks:
      - napoleon-network

  # --- 将来のサービス ---
  # Python Flask API (example)
  # flask-api:
  #   build:
  #     context: ./flask
  #     dockerfile: Dockerfile
  #   container_name: napoleon-flask-api
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-local-dev-password-change-me}@supabase-db:5432/postgres
  #   depends_on:
  #     supabase-db:
  #       condition: service_healthy
  #   networks:
  #     - napoleon-network

networks:
  napoleon-network:
    driver: bridge

volumes:
  supabase-db-data:
