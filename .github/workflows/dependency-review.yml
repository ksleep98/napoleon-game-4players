name: Dependency Review

# PRで新規・更新される依存関係をスキャンし、既知の脆弱性があればブロック
# 参考: https://zenn.dev/dely_jp/articles/supply-chain-kowai

on:
  pull_request:
    branches:
      - develop
      # main は除外: develop → main PR では、developで既にチェック済みのため不要

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # 脆弱性の重要度がこのレベル以上の場合は失敗
          # low, moderate, high, critical
          fail-on-severity: moderate

          # ライセンスポリシー
          # 許可しないライセンスを含む依存関係があれば失敗
          #
          # ⚠️ deny-licenses は Action 側で deprecated 扱い（次のメジャーで削除の
          #    可能性あり）。代替は allow-licenses だが、そちらは「許可するものを
          #    全列挙」する方式で、未知のライセンスが出るたびに CI が落ちる。
          #    運用コストが跳ね上がるので、削除が現実になるまでは据え置く。
          deny-licenses: GPL-2.0, LGPL-2.0

          # ライセンスチェックから除外するパッケージ（purl 形式）
          #
          # @img/sharp-libvips-* は LGPL-3.0-or-later。sharp のプリビルド
          # ネイティブバイナリで、sharp は Next.js の画像最適化が引く依存のため
          # 外せない。
          #
          # この Action は「その PR で新しく現れたバージョン」だけを見るので、
          # 既に develop に入っている版は素通りし、bump したときだけ落ちる。
          # 実際 #534 (next 16.2.12 → 16.3.0) が libvips 1.2.4 → 1.3.2 の
          # 更新だけで落ちた。develop には 1.2.4 が既にあり、ライセンス上の露出は
          # 変わっていないのに赤くなる。この状態を放置すると「dependency-review が
          # 赤いのは毎度のこと」になり、本物の指摘を見逃す。
          #
          # 対象は lockfile 上に存在する 10 パッケージ全て。バージョンを付けない
          # purl は全バージョンにマッチするので、bump のたびに追記する必要はない。
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64

          # スコープ制限（dev依存関係も含める）
          fail-on-scopes: runtime, development

          # コメント投稿（脆弱性の詳細をPRに表示）
          comment-summary-in-pr: always

          # 依存関係の変更内容を詳細に表示
          show-openssf-scorecard: true

          # GitHub Advisory Databaseの脆弱性チェック
          vulnerability-check: true

          # 設定ファイル（カスタムポリシー）
          # config-file: .github/dependency-review-config.yml
