name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    # NOTE: paths-ignore is intentionally NOT set here.
    # The workflow must always trigger so the required `ci-pipeline` status
    # check is reported (otherwise a PR touching only ignored paths would
    # be unmergeable). Path-based work skipping is handled below in the
    # "Detect changes" step.
    # 旧 e2e.yml（build + smoke）と dependency-review.yml もこのワークフローの
    # 別ジョブとして同居している（e2e-tests / dependency-review）。

# Prevent duplicate runs for the same commit
# (e2e-tests / dependency-review も同じ run に属するため、新しい push で一緒に置き換わる)
# For PRs: use PR number to group
# For pushes: use branch ref to group
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    # Optimized CI pipeline for fast feedback
    # NOTE: ジョブ単位の if は置かない。必須チェックなので、どの develop 向け PR でも
    # 必ず報告させる（以前あった `🚀 Release` タイトル判定は、リリース PR が main
    # 向けでこのワークフロー自体が起動しないため死んでおり、逆に develop 向け PR が
    # タイトルだけで必須チェックをスキップできる穴になっていた）。
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Detect changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # 差分が取れない場合（巨大 PR で gh pr diff が HTTP 406 になる等）は
          # 必須チェックを落とさず、安全側に倒してフル CI を走らせる
          if ! CHANGED=$(gh pr diff "$PR_NUMBER" --name-only); then
            echo "::warning::Failed to list changed files; running full CI"
            echo "needs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"

          # Workflow file changes always require full CI.
          if echo "$CHANGED" | grep -q '^\.github/workflows/'; then
            echo "→ workflow file changed; running full CI"
            echo "needs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Files matching this regex don't need CI work.
          # Mirrors the original paths-ignore list.
          IGNORE='^(.+\.md|docs/.+|\.vscode/.+|\.husky/.+|scripts/.+|\.claude/.+|renovate\.json|LICENSE|\.gitignore|\.github/dependabot\.yml|docker-compose\.yml|.+\.config\.yml)$'

          NEEDS=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! [[ $f =~ $IGNORE ]]; then
              NEEDS=true
              break
            fi
          done <<< "$CHANGED"

          if [ "$NEEDS" = "false" ]; then
            echo "✅ Only ignored paths changed — reporting ci-pipeline success without running checks"
          fi
          echo "needs=$NEEDS" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.changes.outputs.needs == 'true'
        uses: actions/checkout@v7.0.1
        with:
          # Only fetch current commit for speed
          fetch-depth: 1

      - name: Setup pnpm
        if: steps.changes.outputs.needs == 'true'
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js with cache
        if: steps.changes.outputs.needs == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
          cache: "pnpm"

      - name: Install dependencies and fix Biome
        if: steps.changes.outputs.needs == 'true'
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

          echo "🔧 Fixing Biome installation for Linux..."
          # Biome はバイナリをプラットフォーム別の optional dependency として配る。
          # キャッシュ復元後にそれが欠けたり壊れたりするケースを踏んだため、
          # ここで一度消してから入れ直す。
          #
          # 入れ直す先は必ずロックファイルの版であること。以前は
          # `pnpm add @biomejs/biome@latest` としており、CI だけが全開発者と
          # 違うフォーマッタで動いていた。biome が整形を変えるリリースを出すと
          # 無関係な PR が一斉に落ちる（#512 で実際に発生）。加えて毎回
          # 公開直後のパッケージを引くことになり、サプライチェーン対策として
          # Dependabot の 7 日クールダウンを敷いている方針とも矛盾する。
          #
          # 消す前にロックで解決済みの版を控え、その版を明示して入れ直す。
          BIOME_VERSION="$(node -p "require('./node_modules/@biomejs/biome/package.json').version")"
          echo "🔒 Locked Biome version: ${BIOME_VERSION}"

          rm -rf node_modules/@biomejs/biome node_modules/.bin/biome 2>/dev/null || true
          pnpm add "@biomejs/biome@${BIOME_VERSION}"

          # Verify installation
          if npx @biomejs/biome --version; then
            echo "✅ Biome installation verified"
          else
            echo "⚠️ Biome installation failed, will use TypeScript-only checks"
            echo "BIOME_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Run quality checks in parallel
        if: steps.changes.outputs.needs == 'true'
        run: |
          # Run multiple checks in parallel using background processes
          echo "🚀 Starting parallel quality checks..."

          # Check if Biome is available, otherwise skip lint/format checks
          if [ "$BIOME_FAILED" = "true" ]; then
            echo "⚠️ Biome unavailable, running TypeScript and test checks..."

            # Run type check and tests when Biome is not available
            pnpm type-check &
            PID_TYPE=$!

            pnpm test:ci &
            PID_TEST=$!

            wait $PID_TYPE
            TYPE_RESULT=$?

            wait $PID_TEST
            TEST_RESULT=$?

            echo "✅ Type check: $([ $TYPE_RESULT -eq 0 ] && echo "PASSED" || echo "FAILED")"
            echo "✅ Tests: $([ $TEST_RESULT -eq 0 ] && echo "PASSED" || echo "FAILED")"

            if [ $TYPE_RESULT -ne 0 ] || [ $TEST_RESULT -ne 0 ]; then
              echo "❌ One or more checks failed"
              exit 1
            fi

            echo "🎉 Type check and tests passed! (Biome checks skipped)"
          else
            # Run full quality checks in parallel
            pnpm lint &
            PID_LINT=$!

            pnpm type-check &
            PID_TYPE=$!

            pnpm format:check &
            PID_FORMAT=$!

            pnpm test:ci &
            PID_TEST=$!

            # Wait for all processes and capture exit codes
            wait $PID_LINT
            LINT_RESULT=$?

            wait $PID_TYPE
            TYPE_RESULT=$?

            wait $PID_FORMAT
            FORMAT_RESULT=$?

            wait $PID_TEST
            TEST_RESULT=$?

            # Report results
            echo "✅ Lint check: $([ $LINT_RESULT -eq 0 ] && echo "PASSED" || echo "FAILED")"
            echo "✅ Type check: $([ $TYPE_RESULT -eq 0 ] && echo "PASSED" || echo "FAILED")"
            echo "✅ Format check: $([ $FORMAT_RESULT -eq 0 ] && echo "PASSED" || echo "FAILED")"
            echo "✅ Tests: $([ $TEST_RESULT -eq 0 ] && echo "PASSED" || echo "FAILED")"

            # Exit with error if any check failed
            if [ $LINT_RESULT -ne 0 ] || [ $TYPE_RESULT -ne 0 ] || [ $FORMAT_RESULT -ne 0 ] || [ $TEST_RESULT -ne 0 ]; then
              echo "❌ One or more quality checks failed"
              exit 1
            fi

            echo "🎉 All quality checks passed!"
          fi

      - name: Fast build check
        if: steps.changes.outputs.needs == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
          # Optimize build for CI
          NODE_ENV: "production"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          echo "🏗️ Fast build verification..."
          pnpm build

  # 旧 e2e.yml の workflow レベル paths-ignore をジョブ単位で再現する判定ジョブ。
  # paths-ignore はワークフロー全体を起動させなくするため、必須チェック
  # `ci-pipeline` と同居させると docs だけの PR で ci-pipeline が報告されなくなる。
  # そのため判定は ci-pipeline と独立したジョブで行い、e2e-tests だけが参照する。
  # ci-pipeline はこのジョブに依存しない（判定が落ちても ci-pipeline は影響を受けない）。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.detect.outputs.e2e }}
    steps:
      - name: Detect changes for E2E smoke test
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # 差分が取れない場合（巨大 PR で gh pr diff が失敗する等）は安全側に倒して実行する
          if ! CHANGED=$(gh pr diff "$PR_NUMBER" --name-only); then
            echo "::warning::Failed to list changed files; running E2E smoke test"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"

          # Mirrors the former e2e.yml paths-ignore list (glob semantics:
          # `**.md` / `**.json` match at any depth; `*.config.yml`, LICENSE and
          # .gitignore match only at the repository root).
          # .github/workflows/** is NOT ignored (workflow changes must run E2E).
          IGNORE='^(.+\.md|docs/.+|\.vscode/.+|\.husky/.+|scripts/.+|.+\.json|LICENSE|\.gitignore|\.github/dependabot\.yml|docker-compose\.yml|[^/]+\.config\.yml)$'

          NEEDS=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! [[ $f =~ $IGNORE ]]; then
              NEEDS=true
              break
            fi
          done <<< "$CHANGED"

          if [ "$NEEDS" = "false" ]; then
            echo "✅ Only ignored paths changed — skipping E2E smoke test"
          fi
          echo "e2e=$NEEDS" >> "$GITHUB_OUTPUT"

  # 旧 e2e.yml。Playwright は動かさず、build + smoke（Next.js 起動とトップページ 200）のみ。
  # 実デプロイ先に対する Playwright は e2e-develop.yml が担当する。
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js with cache
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
          NODE_ENV: "production"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Run smoke test (Next.js boot + homepage 200)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
          NODE_ENV: "production"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm smoke

  # 旧 dependency-review.yml。
  # PRで新規・更新される依存関係をスキャンし、既知の脆弱性があればブロック
  # 参考: https://zenn.dev/dely_jp/articles/supply-chain-kowai
  # main 向け PR は対象外（このワークフロー自体が develop 向け PR でのみ起動する）。
  # develop → main PR では、develop で既にチェック済みのため不要。
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          # 脆弱性の重要度がこのレベル以上の場合は失敗
          # low, moderate, high, critical
          fail-on-severity: moderate

          # ライセンスポリシー
          # 許可しないライセンスを含む依存関係があれば失敗
          #
          # ⚠️ deny-licenses は Action 側で deprecated 扱い（次のメジャーで削除の
          #    可能性あり）。代替は allow-licenses だが、そちらは「許可するものを
          #    全列挙」する方式で、未知のライセンスが出るたびに CI が落ちる。
          #    運用コストが跳ね上がるので、削除が現実になるまでは据え置く。
          deny-licenses: GPL-2.0, LGPL-2.0

          # ライセンスチェックから除外するパッケージ（purl 形式）
          #
          # @img/sharp-libvips-* は LGPL-3.0-or-later。sharp のプリビルド
          # ネイティブバイナリで、sharp は Next.js の画像最適化が引く依存のため
          # 外せない。
          #
          # この Action は「その PR で新しく現れたバージョン」だけを見るので、
          # 既に develop に入っている版は素通りし、bump したときだけ落ちる。
          # 実際 #534 (next 16.2.12 → 16.3.0) が libvips 1.2.4 → 1.3.2 の
          # 更新だけで落ちた。develop には 1.2.4 が既にあり、ライセンス上の露出は
          # 変わっていないのに赤くなる。この状態を放置すると「dependency-review が
          # 赤いのは毎度のこと」になり、本物の指摘を見逃す。
          #
          # 対象は lockfile 上に存在する 10 パッケージ全て。バージョンを付けない
          # purl は全バージョンにマッチするので、bump のたびに追記する必要はない。
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64

          # スコープ制限（dev依存関係も含める）
          fail-on-scopes: runtime, development

          # コメント投稿（脆弱性の詳細をPRに表示）
          comment-summary-in-pr: always

          # 依存関係の変更内容を詳細に表示
          show-openssf-scorecard: true

          # GitHub Advisory Databaseの脆弱性チェック
          vulnerability-check: true

          # 設定ファイル（カスタムポリシー）
          # config-file: .github/dependency-review-config.yml
