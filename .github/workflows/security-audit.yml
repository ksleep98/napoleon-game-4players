name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.audit.outputs.ok }}
      vulnerabilities: ${{ steps.audit.outputs.vulnerabilities }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Security Audit
        id: audit
        continue-on-error: true
        run: |
          # pnpm audit は脆弱性があると非 0 で終わる。|| true が無いとここでステップが
          # 止まって件数が出力されず、検出しても Issue が作られなかった
          pnpm audit --audit-level=moderate --json > audit-result.json || true
          # 結果を読めたときだけ ok。読めないまま 0 件扱いで Issue を閉じないため
          if jq -e '.metadata.vulnerabilities | type == "object"' audit-result.json >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            # --audit-level と揃えて moderate 以上だけ数える
            VULN_COUNT=$(jq '[.metadata.vulnerabilities | (.moderate // 0), (.high // 0), (.critical // 0)] | add' audit-result.json)
          else
            VULN_COUNT=0
          fi
          echo "vulnerabilities=$VULN_COUNT" >> "$GITHUB_OUTPUT"

      - name: Check Outdated Packages
        id: outdated
        continue-on-error: true
        run: |
          pnpm outdated --format json > outdated.json || echo "[]" > outdated.json
          OUTDATED_COUNT=$(cat outdated.json | jq '. | length')
          echo "outdated=$OUTDATED_COUNT" >> $GITHUB_OUTPUT

      - name: Upload audit result
        if: steps.audit.outputs.ok == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pnpm-audit-result
          path: audit-result.json
          retention-days: 7

      - name: Summary
        run: |
          echo "### Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerabilities: ${{ steps.audit.outputs.vulnerabilities }}" >> $GITHUB_STEP_SUMMARY
          echo "- Outdated Packages: ${{ steps.outdated.outputs.outdated }}" >> $GITHUB_STEP_SUMMARY

  # 監査結果を Issue に反映する（検出時は作成・更新、0 件なら閉じる）。
  # pnpm install で依存のコードを実行するジョブに issues: write を渡さないよう分けている
  audit-issue:
    needs: [security-audit]
    if: >-
      !cancelled() &&
      needs.security-audit.outputs.ok == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download audit result
        if: needs.security-audit.outputs.vulnerabilities != '0'
        uses: actions/download-artifact@v8.0.2
        with:
          name: pnpm-audit-result

      - name: Sync issue
        uses: actions/github-script@v9.0.0
        env:
          VULNS: ${{ needs.security-audit.outputs.vulnerabilities }}
        with:
          script: |
            const sync = require('./.github/scripts/sync-audit-issue.js')
            await sync({
              github,
              context,
              kind: 'npm',
              resultPath: 'audit-result.json',
              vulnerabilities: Number(process.env.VULNS),
              // このワークフローは schedule と手動実行のみなので、どちらでも作成・更新してよい
              isScheduled: true,
            })
