name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Security Audit
        id: audit
        continue-on-error: true
        run: |
          pnpm audit --audit-level=moderate --json > audit-result.json
          VULN_COUNT=$(cat audit-result.json | jq '.metadata.vulnerabilities | to_entries | map(select(.value > 0)) | length')
          echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT

      - name: Check Outdated Packages
        id: outdated
        continue-on-error: true
        run: |
          pnpm outdated --format json > outdated.json || echo "[]" > outdated.json
          OUTDATED_COUNT=$(cat outdated.json | jq '. | length')
          echo "outdated=$OUTDATED_COUNT" >> $GITHUB_OUTPUT

      - name: Create Issue if Vulnerabilities Found
        if: steps.audit.outputs.vulnerabilities > 0
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const auditResult = JSON.parse(fs.readFileSync('audit-result.json', 'utf8'));

            let advisories = '';
            if (auditResult.advisories) {
              for (const [id, advisory] of Object.entries(auditResult.advisories)) {
                advisories += '\n### ' + advisory.title + '\n';
                advisories += '- Package: ' + advisory.module_name + '\n';
                advisories += '- Severity: ' + advisory.severity + '\n';
                advisories += '- Vulnerable: ' + advisory.vulnerable_versions + '\n';
                advisories += '- Patched: ' + advisory.patched_versions + '\n';
                advisories += '- CVE: ' + advisory.cves.join(', ') + '\n';
                advisories += '- Info: ' + advisory.url + '\n';
              }
            }

            const issueBody = '## Security Vulnerabilities Detected\n\n' +
              'Weekly security audit found vulnerabilities.\n\n' +
              '**Date**: ' + new Date().toISOString().split('T')[0] + '\n\n' +
              '## Vulnerabilities\n' + advisories + '\n\n' +
              '## Action Required\n\n' +
              '1. Review vulnerabilities above\n' +
              '2. Update packages: pnpm update package-name --latest\n' +
              '3. Or use overrides in package.json\n' +
              '4. Run tests: pnpm test\n' +
              '5. Create PR with fixes\n\n' +
              '## Reference\n\n' +
              '- [Supply Chain Security Guide](./docs/security/SUPPLY_CHAIN_SECURITY.md)\n';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Audit: Vulnerabilities Found (' + new Date().toISOString().split('T')[0] + ')',
              body: issueBody,
              labels: ['security', 'dependencies']
            });

      - name: Summary
        run: |
          echo "### Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerabilities: ${{ steps.audit.outputs.vulnerabilities }}" >> $GITHUB_STEP_SUMMARY
          echo "- Outdated Packages: ${{ steps.outdated.outputs.outdated }}" >> $GITHUB_STEP_SUMMARY
