name: Playwright Cache Warmup

# Populates a Playwright browser cache on the default branch (develop) so that
# PR-triggered E2E jobs can hit it. GitHub Actions caches are scoped per branch
# with read-fallback only to the default branch — without this workflow, every
# PR re-downloads the ~250MB Chromium binary on its first run.

on:
  push:
    branches: [develop]
    # Only run when something that could affect Playwright version changed.
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/playwright-cache.yml"
  workflow_dispatch: {}

concurrency:
  group: playwright-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js with cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Report
        run: |
          echo "Playwright version: ${{ steps.playwright-version.outputs.version }}"
          echo "Cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
