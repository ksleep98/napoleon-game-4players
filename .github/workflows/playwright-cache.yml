name: Playwright Cache Warmup

# Populates a Playwright browser cache on the default branch (develop) so that
# PR-triggered E2E jobs can hit it. GitHub Actions caches are scoped per branch
# with read-fallback only to the default branch — without this workflow, every
# PR re-downloads the ~250MB Chromium binary on its first run.

on:
  push:
    branches: [develop]
    # Only run when something that could affect Playwright version changed.
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/playwright-cache.yml"
  workflow_dispatch: {}

concurrency:
  group: playwright-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js with cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Report
        run: |
          echo "Playwright version: ${{ steps.playwright-version.outputs.version }}"
          echo "Cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
