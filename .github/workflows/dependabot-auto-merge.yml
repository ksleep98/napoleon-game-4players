name: Dependabot Auto Merge

# Dependabot の patch / minor 更新に auto-merge を予約する。予約の可否は
# .github/scripts/dependabot-auto-merge.sh が判定する（major 除外・公開から 7 日以上）。
# マージ可否の最終判断は develop の Ruleset（必須チェック ci-pipeline・strict）に任せる。
#
# トリガーは schedule のみ。
# - pull_request_target は 2026-12-02 から public リポジトリで既定ブロックになる
#   （https://github.blog/changelog/2026-11-02-pull_request_target-blocked-by-default-december-2）。
#   例外を許可するより、PR イベントを使わない方が攻撃面も小さい
# - GITHUB_TOKEN で予約した auto-merge によるマージは後続 workflow を起動しない
#   （GitHub の仕様）ため、develop への push でも拾えない
# 新しい PR は最長 20 分（+ schedule の遅延）で判定される。

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-auto-merge-sweep
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Enable auto-merge for eligible PRs
        # 未予約の PR を判定する（公開から日が浅く保留にしたものの再判定を含む）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh pr list --author 'app/dependabot' --base develop --state open \
            --json number,autoMergeRequest --jq '.[] | select(.autoMergeRequest == null) | .number'); do
            .github/scripts/dependabot-auto-merge.sh "$n" || echo "::warning::#$n: evaluation failed"
          done

      - name: Request rebase for the oldest BEHIND PR
        # auto-merge 予約済みで BEHIND の PR を1本だけ rebase させる。全部を一度に
        # rebase すると、1本マージされた時点で残りが再び BEHIND になり CI が無駄になる。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --author 'app/dependabot' --base develop --state open \
            --json number,mergeStateStatus,autoMergeRequest,createdAt \
            --jq 'map(select(.autoMergeRequest != null)) | sort_by(.createdAt)')

          # CI 実行中（BLOCKED で checks が pending）の PR があれば、その結果を待つ
          for n in $(jq -r '.[] | select(.mergeStateStatus == "BLOCKED") | .number' <<<"$prs"); do
            # gh pr checks は pending があると非ゼロで終了するので、終了コードではなく出力で判定する
            pending=$(gh pr checks "$n" --required --json bucket --jq '[.[] | select(.bucket == "pending")] | length' 2>/dev/null) || true
            if [ "${pending:-0}" != "0" ]; then
              echo "#$n is running required checks; waiting."
              exit 0
            fi
          done

          n=$(jq -r 'map(select(.mergeStateStatus == "BEHIND")) | .[0].number // empty' <<<"$prs")
          if [ -z "$n" ]; then
            echo "No BEHIND Dependabot PR with auto-merge enabled."
            exit 0
          fi

          # 前回の依頼に Dependabot がまだ応えていなければ、重ねて依頼しない
          last_commit=$(gh pr view "$n" --json commits --jq '.commits[-1].committedDate')
          already=$(gh pr view "$n" --json comments \
            --jq "[.comments[] | select(.body == \"@dependabot rebase\" and .createdAt > \"$last_commit\")] | length")
          if [ "$already" != "0" ]; then
            echo "#$n: rebase already requested; waiting for Dependabot."
            exit 0
          fi

          gh pr comment "$n" --body "@dependabot rebase"
          echo "Requested rebase for #$n"
