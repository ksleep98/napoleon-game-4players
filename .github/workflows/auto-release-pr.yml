name: Auto Release PR

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for changes and existing PR
        id: check-changes
        run: |
          # Get the latest commit from main branch
          git fetch origin main:main

          # Check if there are any changes between main and develop
          changes_count=$(git rev-list --count main..develop)

          if [ "$changes_count" -eq 0 ]; then
            echo "No changes between main and develop branches. Skipping release PR creation."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found $changes_count changes between main and develop"
          echo "has_changes=true" >> $GITHUB_OUTPUT

          # Check if there's already an open PR from develop to main using gh CLI
          existing_pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$existing_pr" >> $GITHUB_OUTPUT
            echo "Found existing release PR #$existing_pr"
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "No existing release PR found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changes since last release
        id: changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # Get the latest commit from main branch
          git fetch origin main:main

          # Generate detailed release notes
          echo "## ✅ Pre-deployment Checklist" > release_notes.md
          echo "" >> release_notes.md
          echo "- [ ] All CI checks passing" >> release_notes.md
          echo "- [ ] Tests passing" >> release_notes.md
          echo "- [ ] No breaking changes" >> release_notes.md
          echo "- [ ] Ready for production" >> release_notes.md
          echo "" >> release_notes.md

          # Add commit summary
          echo "## 📝 Changes Summary" >> release_notes.md
          echo "" >> release_notes.md
          total_commits=$(git rev-list --count main..develop)
          echo "**Total commits**: $total_commits" >> release_notes.md
          echo "" >> release_notes.md

          # List all commits
          echo "<details>" >> release_notes.md
          echo "<summary>📋 Commit List</summary>" >> release_notes.md
          echo "" >> release_notes.md
          git log --oneline --no-merges main..develop | while read -r line; do
            echo "- $line" >> release_notes.md
          done
          echo "" >> release_notes.md
          echo "</details>" >> release_notes.md
          echo "" >> release_notes.md

          # Add file changes summary
          echo "## 📁 Files Changed" >> release_notes.md
          echo "" >> release_notes.md
          files_changed=$(git diff --name-only main..develop | wc -l | tr -d ' ')
          echo "**Total files changed**: $files_changed" >> release_notes.md
          echo "" >> release_notes.md

          echo "---" >> release_notes.md
          echo "*🤖 Auto-generated release PR - Updated: $(date '+%Y-%m-%d %H:%M:%S UTC')*" >> release_notes.md

          # Set output for next step
          {
            echo 'release_body<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create or update release PR
        if: steps.check-changes.outputs.has_changes == 'true' && steps.check-changes.outputs.pr_exists == 'false'
        env:
          RELEASE_BODY: ${{ steps.changes.outputs.release_body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create PR using gh CLI
          pr_url=$(gh pr create \
            --base main \
            --head develop \
            --title "🚀 Release" \
            --body "$RELEASE_BODY" \
            --label "release")

          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          echo "✅ Release PR #$pr_number created successfully: $pr_url"

      - name: Update existing release PR
        if: steps.check-changes.outputs.has_changes == 'true' && steps.check-changes.outputs.pr_exists == 'true'
        env:
          RELEASE_BODY: ${{ steps.changes.outputs.release_body }}
          PR_NUMBER: ${{ steps.check-changes.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update existing PR description using gh CLI
          gh pr edit $PR_NUMBER --body "$RELEASE_BODY"

          echo "✅ Release PR #$PR_NUMBER updated successfully!"
