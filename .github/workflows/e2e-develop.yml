# Develop環境E2Eテスト自動実行
name: E2E Develop Tests

on:
  # developブランチへのデプロイ後にE2Eテストを実行
  deployment_status:

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      target_url:
        description: "Develop environment URL to test"
        required: true
        default: "https://napoleon-game-dev.vercel.app"
      create_pr:
        description: "Create develop->main PR after successful tests"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  # Develop environment URL (actual Vercel develop environment)
  DEVELOP_URL: "https://napoleon-game-dev.vercel.app"

# Vercel emits multiple deployment_status events per deploy
# (queued -> building -> success). Cancel earlier runs in the same deploy
# group so the PR UI only shows the final outcome instead of 2-3 skipped
# checks per feature-branch deploy.
concurrency:
  group: e2e-develop-${{ github.event.deployment.sha || github.event_name }}
  cancel-in-progress: true

jobs:
  # 実行するか・どの URL を試験するかを決める。
  # Vercel の deployment は environment が "Preview"、ref がコミット SHA で届く
  # （ブランチ名は来ない）ので、デプロイされたコミットが develop の先頭と一致する
  # ときだけ実行する。feature ブランチのプレビューもここで弾かれる。
  resolve:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      url: ${{ steps.decide.outputs.url }}
      create_pr: ${{ steps.decide.outputs.create_pr }}
    steps:
      - name: Decide target
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          INPUT_URL: ${{ github.event.inputs.target_url }}
          INPUT_CREATE_PR: ${{ github.event.inputs.create_pr }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "url=${INPUT_URL:-$DEVELOP_URL}" >> "$GITHUB_OUTPUT"
            # リリース PR は develop から手動実行したときだけ
            if [ "$INPUT_CREATE_PR" != "false" ] && [ "$REF" = "refs/heads/develop" ]; then
              echo "create_pr=true" >> "$GITHUB_OUTPUT"
            else
              echo "create_pr=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          develop_sha=$(gh api "repos/${GH_REPO}/branches/develop" --jq '.commit.sha')
          if [ "$DEPLOY_SHA" != "$develop_sha" ]; then
            echo "Deployment ${DEPLOY_SHA} is not develop HEAD (${develop_sha}); skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # そのデプロイ自体の URL を試験する（エイリアスはまだ前のデプロイを指していることがある）
          echo "url=${DEPLOY_URL:-$DEVELOP_URL}" >> "$GITHUB_OUTPUT"
          echo "create_pr=true" >> "$GITHUB_OUTPUT"

  e2e-develop:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TARGET_URL: ${{ needs.resolve.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # デプロイされたコミットのテスト・設定で試験する（手動実行では実行した ref）
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js with cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22.23.4"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Wait for deployment to be ready
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "🕐 Waiting for deployment to be ready at: $TARGET_URL"

          max_attempts=30
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."

            # Check deployment status (HTTP 401 is acceptable for protected environments)
            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "$TARGET_URL" || echo "000")

            if [ "$status_code" = "200" ] || [ "$status_code" = "401" ]; then
              echo "✅ Deployment is ready! (HTTP $status_code)"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Deployment not ready after $max_attempts attempts (HTTP $status_code)"
              exit 1
            fi

            echo "⏳ Deployment not ready yet (HTTP $status_code), waiting..."
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Run E2E tests against develop environment
        env:
          # Develop環境のURL
          PLAYWRIGHT_BASE_URL: ${{ env.TARGET_URL }}
          # webServerを無効化（develop環境URLを使用）
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          # E2Eテストを有効化
          SKIP_E2E_TESTS: "false"
          # Test environment variables
          NODE_ENV: "test"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
          # Vercel Deployment Protection の回避キー（playwright-develop.config.ts がヘッダーで送る）
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "🌐 Testing against develop environment: $PLAYWRIGHT_BASE_URL"
          echo "🧪 Running E2E tests..."

          # E2Eテスト実行（develop環境用設定）
          pnpm test:e2e:develop || {
            echo "❌ E2E tests failed"
            exit 1
          }

          echo "✅ All E2E tests passed!"

      - name: Generate test report summary
        if: always()
        run: |
          echo "# 🧪 E2E Test Results" > e2e_summary.md
          echo "" >> e2e_summary.md

          if [ -f "test-results/results.json" ] || [ -d "test-results" ]; then
            echo "## ✅ Test Summary" >> e2e_summary.md
            echo "" >> e2e_summary.md
            echo "- **Environment**: Develop" >> e2e_summary.md
            echo "- **URL**: ${TARGET_URL}" >> e2e_summary.md
            echo "- **Browser**: Chromium" >> e2e_summary.md
            echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> e2e_summary.md
            echo "" >> e2e_summary.md

            # テスト結果の詳細を追加
            if [ -d "test-results" ]; then
              failed_tests=$(find test-results -name "*.xml" -exec grep -l "failure" {} \; 2>/dev/null | wc -l || echo "0")
              total_tests=$(find test-results -name "*.xml" 2>/dev/null | wc -l || echo "0")

              if [ "$failed_tests" -eq 0 ] && [ "$total_tests" -gt 0 ]; then
                echo "### ✅ All tests passed! ($total_tests tests)" >> e2e_summary.md
              elif [ "$failed_tests" -gt 0 ]; then
                echo "### ❌ Some tests failed ($failed_tests/$total_tests)" >> e2e_summary.md
              else
                echo "### ⚠️ No test results found" >> e2e_summary.md
              fi
            fi
          else
            echo "### ❌ Tests failed or no results generated" >> e2e_summary.md
          fi

          echo "" >> e2e_summary.md
          echo "---" >> e2e_summary.md
          echo "" >> e2e_summary.md
          echo "🔗 **Playwright Report**: [View HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> e2e_summary.md
          echo "" >> e2e_summary.md

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: develop-e2e-results
          path: |
            test-results/
            playwright-report/
            e2e_summary.md
          retention-days: 14

  create-release-pr:
    needs: [resolve, e2e-develop]
    runs-on: ubuntu-latest
    if: >
      needs.e2e-develop.result == 'success' &&
      needs.resolve.outputs.create_pr == 'true'

    # PR の作成・更新は pull-requests: write で足りる（push はしない）
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Download E2E test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: develop-e2e-results
          path: ./e2e-results

      # リリース PR を作る唯一の経路（旧 auto-release-pr.yml の処理を取り込んだもの）:
      # - checkout は develop のみをローカルブランチにするため、main..develop が
      #   解決できるよう main をローカルに取得する
      # - main と develop に差分が無ければ PR 作成をスキップする
      #   （gh pr create が "No commits between main and develop" で失敗するため）
      - name: Check for changes between main and develop
        id: check_changes
        run: |
          git fetch origin main:main

          changes_count=$(git rev-list --count main..develop)
          if [ "$changes_count" -eq 0 ]; then
            echo "No changes between main and develop branches. Skipping release PR creation."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Found $changes_count changes between main and develop"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if release PR already exists
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: check_pr
        run: |
          existing_pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "existing_pr=$existing_pr" >> $GITHUB_OUTPUT
            echo "📋 Found existing release PR #$existing_pr"
          else
            echo "📋 No existing release PR found"
          fi

      - name: Create or update release PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # E2Eテスト結果を読み込み
          if [ -f "./e2e-results/e2e_summary.md" ]; then
            E2E_RESULTS=$(cat ./e2e-results/e2e_summary.md)
          else
            E2E_RESULTS="# 🧪 E2E Test Results

          ## ✅ Test Summary
          - **Status**: Passed
          - **Environment**: Develop
          - **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          "
          fi

          # Get recent changes since last main
          echo "## 🎉 Ready for Production Release" > pr_body.md
          echo "" >> pr_body.md
          echo "This PR contains tested changes from the develop branch, ready to be merged to main." >> pr_body.md
          echo "" >> pr_body.md

          # 旧 auto-release-pr.yml と同じリリース前チェックリスト
          echo "### ✅ Pre-deployment Checklist" >> pr_body.md
          echo "" >> pr_body.md
          echo "- [ ] All CI checks passing" >> pr_body.md
          echo "- [ ] Tests passing" >> pr_body.md
          echo "- [ ] No breaking changes" >> pr_body.md
          echo "- [ ] Ready for production" >> pr_body.md
          echo "" >> pr_body.md

          # Add recent commits
          echo "### 📋 Recent Changes" >> pr_body.md
          echo "" >> pr_body.md
          git log --oneline --no-merges main..develop | head -n 10 | while read line; do
            commit_hash=$(echo "$line" | cut -d' ' -f1)
            commit_msg=$(echo "$line" | cut -d' ' -f2-)

            if [[ $commit_msg == feat:* ]]; then
              echo "- ✨ **New**: ${commit_msg#feat: } (\`$commit_hash\`)" >> pr_body.md
            elif [[ $commit_msg == fix:* ]]; then
              echo "- 🐛 **Fix**: ${commit_msg#fix: } (\`$commit_hash\`)" >> pr_body.md
            elif [[ $commit_msg == docs:* ]]; then
              echo "- 📚 **Docs**: ${commit_msg#docs: } (\`$commit_hash\`)" >> pr_body.md
            else
              echo "- 🔧 $commit_msg (\`$commit_hash\`)" >> pr_body.md
            fi
          done
          echo "" >> pr_body.md

          # 旧 auto-release-pr.yml と同じ全コミット一覧と変更ファイル数
          # （上の Recent Changes は直近 10 件のみ）。PR 本文の上限（65536 文字）を
          # 超えないよう、一覧は先頭 200 件で打ち切る
          echo "### 📝 Changes Summary" >> pr_body.md
          echo "" >> pr_body.md
          echo "**Total commits**: $(git rev-list --count main..develop)" >> pr_body.md
          echo "" >> pr_body.md
          echo "<details>" >> pr_body.md
          echo "<summary>📋 Commit List</summary>" >> pr_body.md
          echo "" >> pr_body.md
          max_commits=200
          commit_lines=$(git log --oneline --no-merges main..develop | wc -l | tr -d ' ')
          git log --oneline --no-merges main..develop | head -n "$max_commits" | while read -r line; do
            echo "- $line" >> pr_body.md
          done
          if [ "$commit_lines" -gt "$max_commits" ]; then
            echo "- …and $((commit_lines - max_commits)) more" >> pr_body.md
          fi
          echo "" >> pr_body.md
          echo "</details>" >> pr_body.md
          echo "" >> pr_body.md
          echo "**Total files changed**: $(git diff --name-only main..develop | wc -l | tr -d ' ')" >> pr_body.md
          echo "" >> pr_body.md

          # Add E2E test results
          echo "### 🧪 Quality Assurance" >> pr_body.md
          echo "" >> pr_body.md
          echo "$E2E_RESULTS" >> pr_body.md
          echo "" >> pr_body.md

          echo "### 🚀 Deployment Information" >> pr_body.md
          echo "" >> pr_body.md
          echo "- **Source Branch**: \`develop\`" >> pr_body.md
          echo "- **Target Branch**: \`main\`" >> pr_body.md
          echo "- **E2E Tests**: ✅ Passed on develop environment" >> pr_body.md
          echo "- **Auto-merge**: Ready for production deployment" >> pr_body.md
          echo "" >> pr_body.md
          echo "---" >> pr_body.md
          echo "" >> pr_body.md
          echo "🤖 *This PR was automatically created after successful E2E testing on the develop environment.*" >> pr_body.md

          # Create or update PR
          if [ -n "${{ steps.check_pr.outputs.existing_pr }}" ]; then
            # Update existing PR
            PR_NUMBER="${{ steps.check_pr.outputs.existing_pr }}"
            gh pr edit $PR_NUMBER --body "$(cat pr_body.md)"

            # Add comment with new E2E results
            gh pr comment $PR_NUMBER --body "## 🔄 Updated E2E Test Results

          $E2E_RESULTS

          **Test Run**: [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "

            echo "✅ Updated existing release PR #$PR_NUMBER"
          else
            # Create new PR
            PR_URL=$(gh pr create \
              --base main \
              --head develop \
              --title "🚀 Release: Deploy to Production ($(date +%Y-%m-%d))" \
              --body "$(cat pr_body.md)" \
              --label "release")
            # NOTE: 以前は "release,auto-generated" を付けていたが、auto-generated
            # ラベルはリポジトリに存在せず gh pr create が失敗するため release のみにした

            echo "✅ Created new release PR: $PR_URL"
          fi

      - name: Notify on success
        if: success()
        env:
          HAS_CHANGES: ${{ steps.check_changes.outputs.has_changes }}
        run: |
          echo "🎉 E2E tests passed on develop environment!"
          if [ "$HAS_CHANGES" = "true" ]; then
            echo "📋 Release PR has been created/updated for main branch"
            echo "🚀 Ready for production deployment"
          else
            echo "⏭️ No changes between main and develop; release PR was not created/updated"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ E2E tests failed on develop environment"
          echo "🚫 Release PR will not be created until tests pass"
