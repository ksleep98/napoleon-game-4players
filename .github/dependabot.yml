# Dependabot設定
# GitHubが自動的に依存関係の更新PRを作成
# 参考: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # npm/pnpm パッケージの監視
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # 毎週チェック
      day: "monday" # 月曜日
      time: "09:00" # JST 18:00
      timezone: "Asia/Tokyo"
    # 公開直後のパッケージを避ける (.npmrc minimumReleaseAge と同等の役割)
    cooldown:
      default-days: 7
      semver-major-days: 14
      include:
        - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # 脆弱性のみPR作成（通常の更新は手動）
    # open-pull-requests-limit を 0 にすると脆弱性のみ
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # バージョニング戦略
    versioning-strategy: increase-if-necessary
    # 更新を無視する設定
    #
    # typescript のメジャー更新（6.x → 7.x）は保留中。
    # 調査結果（TypeScript 7.0.2 / next 16.2.11・16.2.12 で確認済み）:
    #   - このリポジトリのコード自体は TS 7 と完全互換。
    #     `pnpm type-check` は 0 エラー、`pnpm test:ci` も全件合格した。
    #   - ブロッカーは Next.js 側。TypeScript 7 は Go 実装への書き換えに伴い
    #     JS の Compiler API を提供しなくなり、その API を直接呼んで型チェックを
    #     行っている `next build` が失敗する。
    #     next 16.2.12 のエラーメッセージ:
    #       "TypeScript 7.0.2 does not provide the compiler API required by
    #        Next.js. Enable experimental.useTypeScriptCli in your Next.js
    #        config to use the TypeScript CLI, or install TypeScript 6 instead."
    #   - next 16.2.12 + `experimental.useTypeScriptCli: true` ではビルド成功を
    #     実証済み。ただし experimental フラグ依存になるため採用は見送った。
    #   - 上記フラグが experimental でなくなったら（または Next.js が TS 7 を
    #     標準サポートしたら）この ignore を外して TS 7 に上げられる。
    #
    # 注意: 下の dev-dependencies グループは update-types を minor/patch に
    # 絞っているが、これは「グループにまとめる対象」を絞るだけで、対象外の
    # メジャー更新は単独 PR として別に作成される（実際に TS 7.0.2 の PR が
    # 作られた）。メジャー更新を止めるにはこの ignore が必要。
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    # グループ化（関連するパッケージをまとめる）
    groups:
      next-dependencies:
        patterns:
          - "next"
          - "react*"
      supabase-dependencies:
        patterns:
          - "@supabase/*"
      testing-dependencies:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "@playwright/*"
      dev-dependencies:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "typescript"
          - "prettier"
          - "husky"
          - "lint-staged"
        update-types:
          - "minor"
          - "patch"

  # Python (ML training: /python) の監視
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # 公開直後のパッケージを避ける。Python の供給網保護はこの cooldown が唯一の
    # ソース（旧 uv exclude-newer はメンテ負荷のため廃止し、ここに一本化）。
    cooldown:
      default-days: 7
      semver-major-days: 14
      include:
        - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    versioning-strategy: increase-if-necessary
    groups:
      ml-dependencies:
        patterns:
          - "scikit-learn"
          - "pandas"
          - "numpy"
          - "joblib"
      ml-serving:
        patterns:
          - "fastapi"
          - "gradio"
          - "uvicorn*"
      supabase-python:
        patterns:
          - "supabase"

  # GitHub Actions の監視
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "ci"
    # グループ化（全てのGitHub Actionsを1つのPRにまとめる）
    groups:
      github-actions:
        patterns:
          - "*"
