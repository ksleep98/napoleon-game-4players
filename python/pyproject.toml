[project]
name = "napoleon-ml-trainer"
version = "0.1.0"
description = "Machine learning trainer for Napoleon Game card prediction"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.118",
  "gradio>=6.7.0",
  "uvicorn[standard]==0.34.0",
  "supabase==2.18.1",
  "pandas==2.2.3",
  "numpy==2.2.1",
  "scikit-learn==1.6.0",
  "joblib==1.4.2",
  "python-dotenv>=1.2.2",
  "pillow>=12.2.0",
  "starlette>=0.49.1",
]

[dependency-groups]
dev = [
  "black>=25",
  "pip-audit>=2.7.3",
  "ruff>=0.8.4",
]

[tool.uv]
# Supply chain attack mitigation: skip packages published in the last 7 days.
# Aligns with the project-wide minimumReleaseAge=10080 policy used by pnpm.
exclude-newer = "2026-05-10T00:00:00Z"

[tool.ruff]
# Formatting is delegated to black; ruff handles lint only.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Disable lint rules that conflict with black's formatting choices.
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py313"]
