[project]
name = "napoleon-ml-trainer"
version = "0.1.0"
description = "Machine learning trainer for Napoleon Game card prediction"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.118",
  "gradio>=6.7.0",
  "uvicorn[standard]==0.48.0",
  "supabase==2.30.1",
  "pandas==3.0.3",
  "numpy==2.4.6",
  "scikit-learn==1.9.0",
  "skops>=0.14.0",
  "python-dotenv>=1.2.2",
  "pillow>=12.2.0",
  "starlette>=0.49.1",
]

[dependency-groups]
dev = [
  "black>=25",
  "pip-audit>=2.7.3",
  "ruff>=0.8.4",
  "pytest>=8",
]

[tool.pytest.ini_options]
# Tests import the `model` and `data` packages as top-level, mirroring how
# train.py / app.py import them at runtime. Put python/ on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# NOTE: supply-chain "skip just-published packages" protection is enforced by
# Dependabot's 7-day cooldown (see .github/dependabot.yml, pip ecosystem), not
# by a uv `exclude-newer` pin. A pinned date had to be hand-bumped on every
# refresh (and is also stamped into uv.lock's [options]), so it was dropped in
# favour of the single Dependabot source of truth. If you ever need a floor for
# a one-off manual lock, pass `uv lock --exclude-newer <DATE>` explicitly.

[tool.ruff]
# Formatting is delegated to black; ruff handles lint only.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Disable lint rules that conflict with black's formatting choices.
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py313"]
