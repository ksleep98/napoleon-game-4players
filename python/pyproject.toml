[project]
name = "napoleon-ml-trainer"
version = "0.1.0"
description = "Machine learning trainer for Napoleon Game card prediction"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.118",
  "gradio>=6.7.0",
  "uvicorn[standard]==0.47.0",
  "supabase==2.30.0",
  "pandas==3.0.3",
  "numpy==2.4.5",
  "scikit-learn==1.8.0",
  "skops>=0.14.0",
  "python-dotenv>=1.2.2",
  "pillow>=12.2.0",
  "starlette>=0.49.1",
]

[dependency-groups]
dev = [
  "black>=25",
  "pip-audit>=2.7.3",
  "ruff>=0.8.4",
  "pytest>=8",
]

[tool.pytest.ini_options]
# Tests import the `model` and `data` packages as top-level, mirroring how
# train.py / app.py import them at runtime. Put python/ on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Supply chain attack mitigation: skip packages published in the last 7 days.
# Aligns with the project-wide minimumReleaseAge=10080 policy used by pnpm.
# Bumped to admit pip 26.1.2 (PYSEC-2026-196 fix, published 2026-05-31); still
# only allows packages aged >= 7 days.
exclude-newer = "2026-06-01T00:00:00Z"

[tool.ruff]
# Formatting is delegated to black; ruff handles lint only.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Disable lint rules that conflict with black's formatting choices.
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py313"]
